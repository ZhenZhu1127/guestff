<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="客人查看">
<title>客人查看</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#17212b;--sub:#66727f;--line:#dde3e9;--accent:#0f6b6b;--on:#fff;--red:#d32f2f;--orange:#ff8c00;--green:#2e7d32}
@media (prefers-color-scheme:dark){:root{--bg:#12171c;--card:#1c242c;--ink:#e8edf2;--sub:#98a4b0;--line:#2c3742;--accent:#4fc3c3;--on:#0b1a1a;--green:#66bb6a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{position:sticky;top:0;background:var(--bg);padding:12px 14px 8px;z-index:5}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
h1{font-size:22px;margin:0}
button{font:inherit;border-radius:10px;padding:9px 14px;background:var(--card);color:var(--ink);border:1px solid var(--line)}
button.p{background:var(--accent);color:var(--on);border-color:var(--accent)}
input[type=search],input[type=file]{font:inherit;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
#list{padding:4px 14px 40px;display:grid;gap:10px}
.g{background:var(--card);border-radius:12px;padding:12px 14px;border-left:6px solid var(--line)}
.g.orange{border-left-color:var(--orange)}.g.red{border-left-color:var(--red)}
.r1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.nm{font-weight:600;font-size:17px}.cd,.r2{color:var(--sub);font-size:14px}
.r2{margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 14px}
.nx.orange{color:var(--orange);font-weight:600}.nx.red{color:var(--red);font-weight:600}
.pay.on{color:var(--green);font-weight:600}
.tag{background:var(--accent);color:var(--on);border-radius:6px;padding:0 7px;font-size:12px}
.empty{text-align:center;color:var(--sub);padding:50px 20px}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 30px);display:none}
.sheet.on{display:block}
dl{background:var(--card);border-radius:12px;padding:6px 14px;margin:14px 0}
dt{color:var(--sub);font-size:13px;margin-top:10px}dd{margin:2px 0 10px;white-space:pre-wrap}
.hint{color:var(--sub);font-size:14px}
</style>
</head>
<body>
<header>
  <div class="bar"><h1>客人</h1><button id="more">导入</button></div>
  <input id="q" type="search" placeholder="搜索客户号、名字、城市、备注">
</header>
<div id="list"></div>
<div class="sheet" id="view"><button id="back">返回</button><h1 id="vn" style="margin-top:14px"></h1><dl id="vd"></dl></div>
<div class="sheet" id="imp">
  <h1>导入</h1>
  <p class="hint">在电脑版点「导出到手机」，把 guests_export.json 传到手机后在这里选择。导入会覆盖手机上现有的全部客人。</p>
  <input id="file" type="file" accept=".json,application/json">
  <p class="hint" id="msg"></p>
  <button class="p" id="close">返回</button>
</div>
<script>
var KEY="guests_v1",data=[];
function $(i){return document.getElementById(i)}
function load(){try{data=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){data=[]}}
function left(s){if(!s)return null;var d=new Date(s+"T00:00:00"),t=new Date();t.setHours(0,0,0,0);return Math.round((d-t)/864e5)}
function payInfo(s){if(!s)return["",false];var n=left(s);
  if(n===null)return[s,false];
  if(n<0)return[s+"（已到期 "+(-n)+" 天）",true];
  if(n===0)return[s+"（今天到期）",true];
  if(n<=7)return[s+"（还有 "+n+" 天到期）",true];
  return[s,false]}
function lvl(s){var n=left(s);return n===null?"":n<=2?"red":n<=7?"orange":""}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function render(){
  var k=$("q").value.trim().toLowerCase();
  var rows=data.filter(function(g){return !k||[g.code,g.name,g.city,g.note].join(" ").toLowerCase().indexOf(k)>-1});
  rows.sort(function(a,b){if(!a.next!==!b.next)return a.next?-1:1;return (a.next||"").localeCompare(b.next||"")||a.name.localeCompare(b.name)});
  $("list").innerHTML=rows.length?rows.map(function(g){var l=lvl(g.next);
    return '<div class="g '+l+'" data-i="'+data.indexOf(g)+'"><div class="r1"><span class="nm">'+esc(g.name)+'</span><span class="cd">'+esc(g.code)+'</span></div><div class="r2">'
    +(g.city?'<span>'+esc(g.city)+'</span>':'')+'<span>上次 '+(esc(g.last)||"—")+'</span><span class="nx '+l+'">下次 '+(esc(g.next)||"未安排")+'</span>'
    +(g.pay?'<span class="pay'+(payInfo(g.pay)[1]?' on':'')+'">付款 '+esc(payInfo(g.pay)[0])+'</span>':'')+(g.stock?'<span class="tag">需要点货</span>':'')+'</div></div>'}).join(""):'<div class="empty">'+(data.length?"没有找到匹配的客人":"还没有客人，请点右上角「导入」。")+'</div>';
}
$("list").onclick=function(e){var c=e.target.closest(".g");if(!c)return;var g=data[c.dataset.i],n=left(g.next);
  $("vn").textContent=g.name;
  var f=[["客户号",g.code],["城市",g.city],["最后一次拜访",g.last],["下一次拜访",g.next?g.next+(n<0?"（已过期 "+(-n)+" 天）":n===0?"（今天）":"（还有 "+n+" 天）"):"未安排"],["下次付款",payInfo(g.pay)[0]],["需要帮忙点货",g.stock?"是":"否"],["备注",g.note]];
  $("vd").innerHTML=f.map(function(x){return "<dt>"+x[0]+"</dt><dd>"+(esc(x[1])||"—")+"</dd>"}).join("");
  $("view").classList.add("on")};
$("back").onclick=function(){$("view").classList.remove("on")};
$("q").oninput=render;
$("more").onclick=function(){$("msg").textContent="";$("imp").classList.add("on")};
$("close").onclick=function(){$("imp").classList.remove("on")};
$("file").onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var j=JSON.parse(r.result),a=Array.isArray(j)?j:j.guests;if(!Array.isArray(a))throw 0;
    if(!confirm("将导入 "+a.length+" 位客人，并覆盖手机上现有的全部客人。继续吗？"))return;
    data=a.map(function(g){return{code:g.code||"",name:g.name||"",city:g.city||"",last:g.last||"",next:g.next||"",stock:!!g.stock,pay:g.pay||"",note:g.note||""}});
    localStorage.setItem(KEY,JSON.stringify(data));render();$("msg").textContent="已导入 "+data.length+" 位客人。";
  }catch(x){$("msg").textContent="文件格式不对，请选择电脑版导出的 guests_export.json。"}e.target.value=""};
  r.readAsText(f)};
load();render();
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){navigator.serviceWorker.register("sw.js").catch(function(){})}
</script>
</body>
</html>
